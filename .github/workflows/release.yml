# Builds, signs, notarizes and publishes Flash to GitHub Releases, from a signed
# tag and only on a reviewer's approval. Same model as kosha's release:
#
#   git tag -s v0.4 -m "Flash 0.4" && git push origin v0.4
#   gh workflow run release.yml --ref v0.4 -f tag=v0.4 -f publish=true
#   (approve the `release` deployment: Actions → the run → Review deployments)
#   make publish-cask     # after checking the release; uses your own gh login
#
# Dry run, which builds and keeps artifacts but publishes nothing:
#
#   gh workflow run release.yml --ref main -f tag=v0.4 -f publish=false
#
# `verify` holds no secrets and runs before the approval, so a bad tag fails
# there. The dmg/zip get a build-provenance attestation, so anyone can check
# they came from this workflow:
#
#   gh attestation verify Flash-0.4.dmg --repo sriinnu/flash
#
# Every published release is signed and notarized: without the secrets below,
# release.sh refuses to publish and this job fails.
#
#   DEVELOPER_ID_P12_BASE64   base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD password chosen when exporting that .p12
#   DEVELOPER_ID              e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_KEY_P8_BASE64      base64 of the App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_KEY_ID             that key's Key ID
#   NOTARY_ISSUER             Issuer ID from the same App Store Connect page
#
# All of them are secrets on the "release" environment, not the repo:
# `make release-secrets` puts them there. No tap token on purpose: CI can't
# touch the Homebrew tap. Actions are pinned to commit SHAs because this job
# holds the signing certificate.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed git tag to release (example: v0.4)"
        required: true
        type: string
      publish:
        description: "Publish the GitHub release (off = dry run)"
        required: false
        default: false
        type: boolean

# Each job asks for what it needs.
permissions: {}

# Two releases must not race each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Before anything else touches the input. It reaches `run:` only through
      # env, never through `${{ }}`.
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo "::error::publishing must be dispatched from the tag: --ref $TAG"
            exit 1
          fi

      # Fully qualified: an unqualified ref makes checkout prefer a BRANCH of
      # the same name, while every check resolves the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is signed by a release key and on main
        env:
          TAG: ${{ inputs.tag }}
        # The checker comes from main, like the signers file, so a tag can't
        # bring its own.
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git show origin/main:tools/verify-release-tag.sh > "$RUNNER_TEMP/verify-release-tag.sh"
          bash "$RUNNER_TEMP/verify-release-tag.sh" "$TAG"

      - name: Verify the tag matches Info.plist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' Resources/Info.plist)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG doesn't match Info.plist version $version"
            exit 1
          fi

  release:
    needs: verify
    runs-on: macos-15
    # Secrets live on the "release" environment, which only main and v* tags
    # can deploy to and which waits for a reviewer.
    environment: release
    permissions:
      contents: write       # create the release + upload assets
      id-token: write       # sigstore signing for the provenance attestation
      attestations: write   # store it on the repo
    env:
      # Step-level `if:` can't see secrets, so resolve "is it configured?" once here.
      HAS_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0   # full history: build number = commit count, changelog = log since last tag
          persist-credentials: false

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        if: env.HAS_P12 == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Keep the login keychain in the search list, add ours in front.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write notary API key
        env:
          P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        if: env.HAS_P8 == 'true'
        run: |
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # publish=false is a dry run: build + attach artifacts to the run, don't publish.
          if [[ "$PUBLISH" == "true" ]]; then
            tools/release.sh --publish
          else
            tools/release.sh
          fi

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip

      - name: Keep artifacts on the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: flash-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: ignore

      - name: Clean up signing material
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
