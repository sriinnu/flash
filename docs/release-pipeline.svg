<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-pipeline-title release-pipeline-desc" id="release-pipeline-root">
<title id="release-pipeline-title">Flash release pipeline</title>
<desc id="release-pipeline-desc">Release flow diagram: a Titan-signed tag is verified against allowed signers, then CI builds, signs and notarizes, publishes the GitHub release, attests provenance and opens the Homebrew tap PR.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #release-pipeline-root { --paper:#f7f5f0;--paper-2:#ece9e1;--ink:#1b2733;--muted:#475a6b;--soft:#56687a;--accent:#c42e00;--link:#3b4fb8;--node:#ffffff;--ink-rgb:27,39,51;--muted-rgb:71,90,107;--soft-rgb:86,104,122;--accent-rgb:196,46,0; }
      @media (prefers-color-scheme: dark) { #release-pipeline-root { --paper:#1b2733;--paper-2:#263646;--ink:#f7f5f0;--muted:#c3c8cc;--soft:#93a3b1;--accent:#ff7a3d;--link:#8b9cf0;--node:#263646;--ink-rgb:247,245,240;--muted-rgb:195,200,204;--soft-rgb:147,163,177;--accent-rgb:255,122,61; } }
      #release-pipeline-root { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); }
      #release-pipeline-root .diagram-container { width:100%;overflow-x:auto }
      #release-pipeline-root .notes { margin-top:1.25rem;max-width:820px;color:var(--muted);font-size:.82rem;line-height:1.55;padding-left:1.1rem }
      #release-pipeline-root .notes li { margin-bottom:.35rem }
      #release-pipeline-root .notes code { font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:.76rem;color:var(--ink) }</style><marker id="release-pipeline-release-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--muted)"/></marker><marker id="release-pipeline-release-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--accent)"/></marker><marker id="release-pipeline-release-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--link)"/></marker><marker id="release-pipeline-release-pipeline-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" style="fill:none;stroke:var(--muted);stroke-width:1.2"/></marker></defs>
