<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5f0;--paper-2:#ece9e1;--ink:#1b2733;--muted:#475a6b;--soft:#56687a;--accent:#c42e00;--link:#3b4fb8;--node:#ffffff;--ink-rgb:27,39,51;--muted-rgb:71,90,107;--soft-rgb:86,104,122;--accent-rgb:196,46,0;}
@media (prefers-color-scheme: dark){:root{--paper:#1b2733;--paper-2:#263646;--ink:#f7f5f0;--muted:#c3c8cc;--soft:#93a3b1;--accent:#ff7a3d;--link:#8b9cf0;--node:#263646;--ink-rgb:247,245,240;--muted-rgb:195,200,204;--soft-rgb:147,163,177;--accent-rgb:255,122,61;}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans', system-ui, sans-serif;background:var(--paper);color:var(--ink);padding:3rem 2rem}
.frame{max-width:960px;margin:0 auto}
.eyebrow{font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Fraunces', serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
.diagram-container{width:100%;overflow-x:auto}
svg{width:100%;min-width:960px;display:block}
.notes{margin-top:1.25rem;max-width:820px;color:var(--muted);font-size:.82rem;line-height:1.55;padding-left:1.1rem}
.notes li{margin-bottom:.35rem}
.notes code{font-family:'IBM Plex Mono', ui-monospace, monospace;font-size:.76rem;color:var(--ink)}
</style>
</head>
